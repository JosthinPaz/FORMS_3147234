<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <form class="formulario">
        <label for="nombre">Name</label>
        <input type="text" id="nombre" placeholder="Please enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Please enter your email">

        <label for="edad">Age</label>
        <input type="number" id="edad" placeholder="Please enter your age">

        <label for="opcion">Choose an option</label>
        <select id="opcion">
            <option>Select One Option</option>
            <option>Option 1</option>
            <option>Option 2</option>
            <option>Option 3</option>
        </select>

        <div class="pregunta">
            <span>Do you plan to buy a new car in the next 5 years?</span>
            <div class="opciones-radio">
                <label><input type="radio" name="nuevo_auto"> Yes</label>
                <label><input type="radio" name="nuevo_auto"> No</label>
                <label><input type="radio" name="nuevo_auto"> Maybe</label>
            </div>
        </div>

        <label for="marca">What is your favorite car brand?</label>
        <select id="marca">
            <option>Select One Option</option>
            <option>Toyota</option>
            <option>Ford</option>
            <option>Chevrolet</option>
            <option>Other</option>
        </select>

        <div class="pregunta">
            <span>What type of means of transportation do you own?</span>
            <div class="opciones-checkbox">
                <label><input type="checkbox"> Car</label>
                <label><input type="checkbox"> Boat</label>
                <label><input type="checkbox"> Bicycle</label>
                <label><input type="checkbox"> Motorcycle</label>
                <label><input type="checkbox"> Plane</label>
                <label><input type="checkbox"> Bike</label>
            </div>
        </div>

        <label for="comentarios">Any comments or suggestions?</label>
        <textarea id="comentarios" placeholder="Please enter your comments"></textarea>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
